{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h2>Create your account</h2>
    <p class="sub">Join a project and start labeling.</p>

    {% if message %}
      <div class="alert">{{ message }}</div>
    {% endif %}

    <form action="/perform_registration" method="POST">
      <label>Username<input name="username" required autofocus></label>
      <label>Email<input name="email" type="email" required></label>
      <label>Password<input name="password" type="password" required></label>
      <button type="submit" class="full">Create account</button>
    </form>

    <p class="alt">Already have an account? <a href="/login">Log in</a></p>
  </div>
</div>
{% endblock %}
